# Serve the production bundle and proxy the API on the same origin.
# The backend is resolved through Docker's embedded DNS so a recreated backend container stays reachable.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $docksight_backend http://backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # A variable proxy_pass without a URI forwards the original request URI unchanged.
    location /api/ {
        proxy_pass $docksight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-sent events must reach the browser as soon as the backend writes them.
        proxy_buffering off;
        gzip off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 1m;
    }

    location /health/ {
        proxy_pass $docksight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
