name: Backend
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend pre-commit run --all-files
        env:
          # Branch guards apply locally; CI also validates master after PR merges.
          SKIP: no-commit-to-branch
      - name: Read combined Python 3.14 coverage
        id: coverage
        run: |
          percent=$(python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(".test-artifacts/backend-coverage.json").read_text(encoding="utf-8"))
          coverage = report["totals"]["percent_covered"]
          print(f"{coverage:.2f}")
          PY
          )
          printf 'percent=%s\n' "$percent" >> "$GITHUB_OUTPUT"
      - run: uv run --project backend pytest backend/tests/integration -m docker --no-cov
        env:
          DOCKSIGHT_TEST_DOCKER: "1"
      - run: docker build -f backend/Dockerfile -t docksight-backend:ci .
      - run: uv run --project backend pytest backend/tests/integration/test_image.py --no-cov
        env:
          DOCKSIGHT_TEST_DOCKER: "1"
          DOCKSIGHT_TEST_BACKEND_IMAGE: docksight-backend:ci

  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked --python ${{ matrix.python }}
      - run: uv run --project backend --python ${{ matrix.python }} pytest backend/tests

  coverage-badge:
    needs: [checks, compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-coverage.yml
    with:
      component: backend
      percent: ${{ needs.checks.outputs.coverage }}
