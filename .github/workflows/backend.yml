name: Backend
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked
      - run: uv run --project backend pre-commit run --all-files
        env:
          # Branch guards apply locally; CI also validates master after PR merges.
          SKIP: no-commit-to-branch
      - run: uv run --project backend pytest backend/tests/integration -m docker --no-cov
        env:
          DOCKSIGHT_TEST_DOCKER: "1"
      - run: docker build -f backend/Dockerfile -t docksight-backend:ci .
      - run: uv run --project backend pytest backend/tests/integration/test_image.py --no-cov
        env:
          DOCKSIGHT_TEST_DOCKER: "1"
          DOCKSIGHT_TEST_BACKEND_IMAGE: docksight-backend:ci

  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --locked --python ${{ matrix.python }}
      - run: uv run --project backend --python ${{ matrix.python }} pytest backend/tests
