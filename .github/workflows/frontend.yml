name: Frontend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check frontend quality gates
        run: npm run check
      - name: Run unit and component tests
        run: npm test
      - name: Read frontend line coverage
        id: coverage
        run: |
          percent=$(node -p 'require("../.test-artifacts/frontend-architecture/coverage/coverage-summary.json").total.lines.pct')
          printf 'percent=%s\n' "$percent" >> "$GITHUB_OUTPUT"
      - name: Build production frontend
        run: npm run build
      - name: Install Chrome and system dependencies
        run: npx playwright install --with-deps chrome
      - name: Run browser tests
        run: npm run test:browser
      - name: Upload browser report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  coverage-badge:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-coverage.yml
    with:
      component: frontend
      percent: ${{ needs.checks.outputs.coverage }}
