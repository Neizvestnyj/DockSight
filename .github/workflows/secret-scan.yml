name: Secret scanning

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
      - name: Scan committed history
        run: |
          "$RUNNER_TEMP/gitleaks" git --verbose --redact --log-opts="--full-history --diff-merges=first-parent HEAD" .
