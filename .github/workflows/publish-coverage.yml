name: Publish coverage badge data

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      percent:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: coverage-badges
      queue: max
    steps:
      - uses: actions/github-script@v9
        env:
          COMPONENT: ${{ inputs.component }}
          COVERAGE: ${{ inputs.percent }}
        with:
          script: |
            const { COMPONENT: component, COVERAGE: percent, GITHUB_RUN_NUMBER: workflowRun } = process.env;
            const runNumber = Number(workflowRun);
            if (!['backend', 'frontend'].includes(component) ||
                !/^(?:100(?:\.0{1,2})?|\d{1,2}(?:\.\d{1,2})?)$/.test(percent) ||
                !Number.isSafeInteger(runNumber) || runNumber < 1) {
              throw new Error('Invalid coverage badge input');
            }

            const repo = context.repo;
            const branch = 'coverage-badges';
            const ref = `refs/heads/${branch}`;
            const path = `${component}.json`;
            const message = `Update ${component} coverage badge`;
            const report = `${JSON.stringify({ coverage: Number(percent), runNumber })}\n`;
            const previous = await github.rest.repos.getContent({ ...repo, path, ref: branch })
              .then(({ data }) => data, (error) => {
                if (error.status !== 404) throw error;
                return null;
              });

            if (previous) {
              const contents = Buffer.from(previous.content, 'base64').toString('utf8');
              if (contents === report || JSON.parse(contents).runNumber > runNumber) return;
            } else {
              const { data: refs } = await github.rest.git.listMatchingRefs({ ...repo, ref: `heads/${branch}` });
              if (!refs.some((candidate) => candidate.ref === ref)) {
                const { data: tree } = await github.rest.git.createTree({
                  ...repo, tree: [{ path, mode: '100644', type: 'blob', content: report }],
                });
                const { data: commit } = await github.rest.git.createCommit({
                  ...repo, message, tree: tree.sha, parents: [],
                });
                await github.rest.git.createRef({ ...repo, ref, sha: commit.sha });
                return;
              }
            }

            await github.rest.repos.createOrUpdateFileContents({
              ...repo, branch, path, message, content: Buffer.from(report).toString('base64'),
              ...(previous && { sha: previous.sha }),
            });
