x-worker: &worker
  image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
  entrypoint: [python, -u, /e2e/workload.py]
  volumes:
    - ./workload.py:/e2e/workload.py:ro
  labels:
    com.docksight.e2e: ${DOCKSIGHT_E2E_OWNER:?Set a unique run owner}
  environment:
    APP_ENV: live-e2e
    DOCKSIGHT_E2E_DENSE_LOGS: ${DOCKSIGHT_E2E_DENSE_LOGS:-0}
  mem_limit: 64m
  memswap_limit: 64m
  cpus: 0.5
  restart: "no"
  networks: [fixture]

services:
  backend:
    <<: *worker
    command: [dependency]
  grafana:
    image: grafana/grafana:13.2@sha256:b21409d7951ddcfd63a4b49083e4ef2cc35bc1437d071813bf82bfb238b00bca
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./alerting.yaml:/etc/grafana/provisioning/alerting/fixture.yaml:ro
    labels:
      com.docksight.e2e: ${DOCKSIGHT_E2E_OWNER:?Set a unique run owner}
    mem_limit: 512m
    cpus: 1
    restart: "no"
    networks: [fixture]
  nginx:
    image: nginx:1.30-alpine@sha256:3bc3836dc0be3b811f238210360bf8e7ca8a2d0effdae46160bf1f3578710051
    labels:
      com.docksight.e2e: ${DOCKSIGHT_E2E_OWNER:?Set a unique run owner}
    mem_limit: 64m
    cpus: 0.5
    networks: [fixture]
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 1s
      timeout: 2s
      retries: 10
  oom:
    <<: *worker
    command: [oom]
  crash:
    <<: *worker
    command: [crash]
    restart: on-failure
  logs:
    <<: *worker
    command: [logs]
  database:
    <<: *worker
    command: [database-logs]
  database-stopped:
    <<: *worker
    command: [database-shutdown]
  unknown:
    <<: *worker
    command: [unknown]
  clean-shutdown:
    <<: *worker
    command: [clean-shutdown]
  database-current:
    <<: *worker
    command: [database-current]
  unhealthy:
    <<: *worker
    command: [unhealthy]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1)"]
      interval: 1s
      timeout: 2s
      retries: 2

networks:
  fixture:
    internal: true
    labels:
      com.docksight.e2e: ${DOCKSIGHT_E2E_OWNER:?Set a unique run owner}
