name: docksight-demo
services:
  worker:
    image: python:3.12-alpine@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    command: [python, -u, /app/worker.py]
    restart: "no"
    environment:
      APP_ENV: demo
      DEMO_SECRET: local-demo-secret-9281
    volumes:
      - ./worker.py:/app/worker.py:ro
      - worker-state:/state
    labels:
      com.docksight.demo: "true"
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; assert Path('/state/healthy').exists()"]
      interval: 5s
      timeout: 2s
      retries: 3
volumes:
  worker-state:
